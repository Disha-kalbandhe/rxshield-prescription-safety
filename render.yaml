services:
  # -----------------------------------------------------------------
  # 1. Backend - Node.js / Express API
  # -----------------------------------------------------------------
  - type: web
    name: rxshield-backend
    runtime: node
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    plan: free
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "10000"
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: FIREBASE_PRIVATE_KEY
        sync: false
      - key: FIREBASE_CLIENT_EMAIL
        sync: false
      - key: ML_API_URL
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: GEMINI_API_KEY
        sync: false

  # -----------------------------------------------------------------
  # 2. ML Service - Python / FastAPI (Docker)
  # -----------------------------------------------------------------
  - type: web
    name: rxshield-ml
    runtime: docker
    rootDir: ml-service
    dockerfilePath: ./Dockerfile
    plan: free
    envVars:
      - key: PORT
        value: "10000"
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
